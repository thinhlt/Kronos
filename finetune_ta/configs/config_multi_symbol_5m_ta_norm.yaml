# Template config for finetuning Kronos on Kaggle, jointly across multiple
# crypto symbols' 5m OHLCV+indicator CSVs (produced by download_data.py ->
# clean_merge_data.py -> prepare_dataset.py). See ../README.md for the full
# Kaggle setup/resume workflow.

data:
  # Glob pattern (or an explicit YAML list of paths) matching every symbol's
  # indicator-augmented CSV. Each file is treated as an independent series --
  # a training window is never built from more than one file. Adjust the
  # repo root if you cloned/uploaded Kronos somewhere other than
  # /kaggle/working/Kronos.
  data_path: /content/drive/MyDrive/Kronos/data/*.csv
  # Equivalent explicit form, if you'd rather pin the exact symbol set:
  # data_path:
  #   - "/content/drive/MyDrive/Kronos/data/BTCUSDT_kline_5min.csv"
  #   - "/content/drive/MyDrive/Kronos/data/ETHUSDT_kline_5min.csv"
  #   - "/content/drive/MyDrive/Kronos/data/BNBUSDT_kline_5min.csv"
  #   - "/content/drive/MyDrive/Kronos/data/SOLUSDT_kline_5min.csv"
  #   - "/content/drive/MyDrive/Kronos/data/XRPUSDT_kline_5min.csv"
  #   - "/content/drive/MyDrive/Kronos/data/ADAUSDT_kline_5min.csv"
  #   - "/content/drive/MyDrive/Kronos/data/DOGEUSDT_kline_5min.csv"
  #   - "/content/drive/MyDrive/Kronos/data/TRXUSDT_kline_5min.csv"
  #   - "/content/drive/MyDrive/Kronos/data/ZECUSDT_kline_5min.csv"
  #   - "/content/drive/MyDrive/Kronos/data/AVAXUSDT_kline_5min.csv"
  lookback_window: 1024
  predict_window: 64
  max_context: 512
  clip: 5.0
  # split ratio is applied PER FILE (each symbol contributes its own last
  # 10% of bars to validation), not by holding out whole symbols.
  train_ratio: 0.9
  val_ratio: 0.1
  test_ratio: 0.0

features:
  indicators:
    heikin_ashi: true
    kdj: true
    macd: true
    bollinger: true
    atr: true
    volume_sma: true

training:
  tokenizer_epochs: 3
  basemodel_epochs: 10
  # Tokenizer is lighter on memory -- use a larger batch. Soft-decode for
  # logic loss adds VRAM on top of the basemodel CE path every epoch.
  tokenizer_batch_size: 256
  basemodel_batch_size: 24
  log_interval: 50
  # Colab usually has 2–4 CPU cores; more workers just contend for host RAM.
  num_workers: 12
  seed: 42

  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.00008

  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1
  # Effective CE batch ≈ basemodel_batch_size * accumulation_steps (64*2=128).
  accumulation_steps: 2

  # Kaggle sessions are capped (~9-12h interactive, 30 GPU-hrs/week quota) and
  # /kaggle/working is wiped on a fresh session -- resume=true makes it safe
  # to just re-run this same command in a new session, as long as
  # base_save_path (or resume_from_path, see model_paths below) still has the
  # previous session's checkpoint_last.pt. checkpoint_every_n_steps also
  # saves mid-epoch, in case a session is cut off before finishing one.
  resume: true
  checkpoint_every_n_steps: 500

  # Mixed precision (AMP) training: speeds up training and reduces memory use
  # on CUDA GPUs by running most ops in a lower-precision dtype. No effect on
  # CPU. 'fp16' works on most GPUs (uses gradient scaling); 'bf16' needs
  # Ampere-or-newer (RTX 30xx+/A100) but needs no scaling.
  use_amp: true
  amp_dtype: "fp16"

  # Predictor-only candle self-consistency penalty (OHLC validity + Heikin-Ashi
  # formula match). Soft-decodes s1/s2 logits through the frozen tokenizer so
  # the penalty is differentiable. Applied every epoch when enabled.
  logic_loss:
    enabled: true
    weight: 25
    ohlc_weight: 2.0
    ha_weight: 2.0
    # VRAM mitigations for soft-decode:
    max_timesteps: 256          # contiguous subsample before decode (keeps HA recurrence)
    use_checkpoint: true        # activation checkpoint tokenizer decoder layers

model_paths:
  pretrained_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  pretrained_predictor: "NeoQuasar/Kronos-base"

  exp_name: "multi_symbol_5m_ta_norm"
  base_path: "/content/drive/MyDrive/finetune_ta/finetuned/"

  base_save_path: ""
  finetuned_tokenizer: ""

  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

  # Set this to resume a run that started in a PREVIOUS Kaggle session:
  # 1. After a session ends, "Save Version" so /kaggle/working becomes a
  #    Kaggle Dataset/output you can attach as input to the next session.
  # 2. Add that output as a Notebook input (Kaggle mounts it read-only under
  #    /kaggle/input/<slug>/...).
  # 3. Point resume_from_path at the experiment directory inside it, e.g.:
  #      resume_from_path: "/kaggle/input/<slug>/Kronos/finetune_ta/finetuned/kaggle_multi_symbol_5m_ta"
  # On startup, if base_save_path has no progress yet, its contents are
  # copied in once so training resumes from the checkpoint as usual and new
  # checkpoints are written to the writable base_save_path.
  resume_from_path: "/content/drive/MyDrive/finetune_ta/finetuned/multi_symbol_5m_ta_norm"

experiment:
  name: "kronos_multi_symbol_5m_ta"
  description: "Multi-symbol (10 USDT pairs) technical-indicator finetune, tuned for Kaggle Notebook sessions"
  use_comet: false

  train_tokenizer: true
  train_basemodel: true
  skip_existing: false

  pre_trained_tokenizer: false
  pre_trained_predictor: true

device:
  use_cuda: true
  device_id: 0
